<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h1>Login</h1>

<form method="POST">
    <label>Username:</label>
    <input type="text" name="username">
    <br><br>
    <button type="submit">Login</button>
</form>

{% if error %}
    <p> {{ error }}</p>
{% endif %}
{% if success %}
    <p>{{ success }}</p>
{% endif %}
</body>
</html>
